# ============================================================================
#  Render.com 一键部署蓝图（Blueprint）
#  ---------------------------------------------------------------------------
#  作用：把本仓库连到 Render 后，平台会按这个文件自动建一个 Web 服务，
#        给你一个**永久不变**的 https 域名（形如 https://smartfit-xxxx.onrender.com），
#        复制这个网址发给任何人，用 4G 也能直接打开，不需要你电脑开着。
#
#  注意（免费套餐的真实限制，别被坑）：
#   · 免费实例 15 分钟无人访问会休眠，唤醒约 30~60 秒（第一次打开慢是正常的）；
#   · 容器文件系统是临时的，重启后 SQLite 会重建（启动时自动导入演示数据，所以内容还在，
#     但用户自己新增的数据会丢）。要保数据就加 Persistent Disk 并把 DB_FILE 指到挂载点。
#   · AI_API_KEY 不要写进仓库：下面用 sync: false，部署后在 Render 控制台填。
# ============================================================================
services:
  - type: web
    name: smartfit
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # 自动生成一个随机的 JWT 密钥，避免用默认值上线
      - key: JWT_SECRET
        generateValue: true
      # 大模型配置：KEY 在控制台手填（不落仓库）
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.deepseek.com/v1
      - key: AI_MODEL
        value: deepseek-chat
      - key: AI_VISION_MODEL
        value: deepseek-chat
      - key: AI_TIMEOUT_MS
        value: "60000"
